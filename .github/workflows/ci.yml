name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # CPU-only torch first, so whisperx does not pull the CUDA wheels on a
      # GPU-less runner (several GB and no benefit here).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ruff
          python -m spacy download en_core_web_sm

      # Explicit flags rather than a config file, pinned to match local runs.
      - name: Lint
        run: ruff check --isolated --select E4,E7,E9,F,I,UP,B,C4,RUF --target-version py311 src tests main.py

      - name: Test
        run: python -m pytest tests/ -q
