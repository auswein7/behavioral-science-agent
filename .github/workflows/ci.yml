name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Read access to the private fair_llm repo. Unset on the fork by
      # default; the maintainer adds it to enable the conformance guard.
      FAIR_LLM_TOKEN: ${{ secrets.FAIR_LLM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # CPU-only torch first, so whisperx does not pull the CUDA wheels on a
      # GPU-less runner (several GB and no benefit here).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ruff
          python -m spacy download en_core_web_sm

      # fair-llm at the commit pinned in requirements-fairlib.txt, the one the
      # fork was verified against; it drives the coder tests and the
      # conformance guard (tests/test_fairlib_conformance.py). Tracking main
      # here would let CI go green on a tree nobody verified; a new main head
      # is verified in tandem before the pin moves. The token rewrite gives
      # pip read access to the private repo. Without the token the install is
      # skipped and the fairlib tests self-skip.
      - name: Install fair-llm (pinned)
        if: env.FAIR_LLM_TOKEN != ''
        run: |
          git config --global url."https://x-access-token:${FAIR_LLM_TOKEN}@github.com/USAFA-AI-Center/".insteadOf "https://github.com/USAFA-AI-Center/"
          pip install -r requirements-fairlib.txt

      # Explicit flags rather than a config file, pinned to match local runs.
      - name: Lint
        run: ruff check --isolated --select E4,E7,E9,F,I,UP,B,C4,RUF --target-version py311 src tests main.py

      - name: Test
        run: python -m pytest tests/ -q
